<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CamelliaTraceabilityCloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#388e3c"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f5e9"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- trace orbit: dashed ring representing the hash-chain / trace loop -->
  <circle cx="32" cy="31" r="23.5" fill="none" stroke="#a5d6a7" stroke-width="1.6" stroke-dasharray="3.4 3" opacity="0.85"/>
  <circle cx="32" cy="7.5" r="1.9" fill="#ffca28"/>
  <circle cx="52.5" cy="42" r="1.6" fill="#a5d6a7"/>
  <circle cx="11.5" cy="42" r="1.6" fill="#a5d6a7"/>

  <!-- camellia blossom: five petals -->
  <g transform="translate(32 31.5)">
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-8.6" rx="7.2" ry="10.6"/>
      <ellipse cx="0" cy="-8.6" rx="7.2" ry="10.6" transform="rotate(72)"/>
      <ellipse cx="0" cy="-8.6" rx="7.2" ry="10.6" transform="rotate(144)"/>
      <ellipse cx="0" cy="-8.6" rx="7.2" ry="10.6" transform="rotate(216)"/>
      <ellipse cx="0" cy="-8.6" rx="7.2" ry="10.6" transform="rotate(288)"/>
    </g>
    <circle r="4.6" fill="#ffca28"/>
    <circle r="2" fill="#f9a825"/>
  </g>
</svg>
